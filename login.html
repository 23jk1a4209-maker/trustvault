<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrustVault | Login</title>
    <style>
        body {
            background-color: #0B0F0D;
            color: #F9FAFB;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #111915;
            border: 1px solid #26352D;
            border-radius: 10px;
            padding: 40px;
            width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            color: #10B981;
            margin-top: 0;
            text-align: center;
        }
        p.subtitle {
            color: #9CA3AF;
            font-size: 13px;
            text-align: center;
            margin-bottom: 25px;
        }
        label {
            display: block;
            color: #9CA3AF;
            font-size: 13px;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            background-color: #0B0F0D;
            border: 1px solid #26352D;
            border-radius: 6px;
            color: #F9FAFB;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #10B981;
            color: #0B0F0D;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #34D399;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🛡️ TrustVault</h2>
        <p class="subtitle">Select your access role to enter vault</p>
        
        <form action="/login" method="POST">
            <label>Corporate Email</label>
            <input type="email" name="email" value="gopikamaddineni643@gmail.com" required>

            <label>Login As (Select Role)</label>
            <select name="role">
                <option value="Owner">👑 Owner (Full Admin & Upload Access)</option>
                <option value="Viewer">👁️ Viewer (Read-Only Access)</option>
            </select>

            <button type="submit">Authenticate & Enter</button>
        </form>
    </div>
</body>
</html>
